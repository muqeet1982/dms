# dms.invoiceflow.pk — Distribution Management SaaS
# React SPA from /var/www/dms/frontend/dist; API/ext/media proxied to gunicorn (unix socket).
server {
    server_name dms.invoiceflow.pk;

    access_log /var/log/nginx/dms_access.log;
    error_log  /var/log/nginx/dms_error.log;

    root /var/www/dms/frontend/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 320M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /static/ {
        alias /var/www/dms/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /var/www/dms/backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~ ^/(api|ext)/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/gunicorn/dms.sock;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
    }

    # Android App Links verification file is served by the API (configured in Platform → Mobile app)
    location = /.well-known/assetlinks.json {
        proxy_set_header Host $host;
        proxy_pass http://unix:/run/gunicorn/dms.sock;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/v1/auth/ {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/gunicorn/dms.sock;
    }

    location ~* /(\.git|\.env|wp-admin|wp-login|xmlrpc\.php|phpmyadmin) {
        return 444;
    }

    # Built assets are content-hashed: cache hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dms.invoiceflow.pk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dms.invoiceflow.pk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dms.invoiceflow.pk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name dms.invoiceflow.pk;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
