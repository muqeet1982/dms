# /etc/fail2ban/filter.d/dms-auth.conf — failed logins, OTP and QR-login attempts on the DMS API.
[Definition]
failregex = ^<HOST> .* "POST /api/v1/auth/(login|otp/verify|qr-login/redeem|password/reset)[^"]*" (400|401|403|410|423) 
            ^<HOST> .* "POST /ext/v1/[^"]*" 401 
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
