# /etc/fail2ban/filter.d/dms-probe.conf — vulnerability scanners and path probes.
[Definition]
failregex = ^<HOST> .* "(GET|POST|HEAD) [^"]*(\.env|\.git|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|phpMyAdmin|/vendor/|/cgi-bin/|/actuator|/solr/|/boaform|/HNAP1|\.aws/|/config\.json|/telescope/|/api/session/properties)[^"]*" (\d+) 
            ^<HOST> .* "[^"]*" 444 
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
