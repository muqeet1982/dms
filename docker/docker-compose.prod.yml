# Optional production compose (single host). The reference deployment on dms.invoiceflow.pk is native — see docs/DEPLOY.md.
services:
  postgres: { image: postgres:16, env_file: ../backend/.env, volumes: [pgdata:/var/lib/postgresql/data], restart: always }
  redis: { image: redis:7, restart: always }
  api:
    build: { context: ../backend, dockerfile: ../docker/Dockerfile.backend }
    env_file: ../backend/.env
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    volumes: [media:/app/media, static:/app/staticfiles]
    depends_on: [postgres, redis]
    restart: always
  worker: { build: { context: ../backend, dockerfile: ../docker/Dockerfile.backend }, env_file: ../backend/.env, command: celery -A config worker -l info, depends_on: [postgres, redis], restart: always }
  beat: { build: { context: ../backend, dockerfile: ../docker/Dockerfile.backend }, env_file: ../backend/.env, command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler, depends_on: [postgres, redis], restart: always }
  web:
    image: nginx:1.27
    volumes: ["../frontend/dist:/usr/share/nginx/html:ro", "./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro", "media:/media:ro", "static:/static:ro"]
    ports: ["80:80"]
    depends_on: [api]
    restart: always
volumes: { pgdata: {}, media: {}, static: {} }
