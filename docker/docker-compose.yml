# Optional: development stack (postgres, redis, minio, mailpit + api/worker). Production on the VPS runs natively (docs/DEPLOY.md).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: dms_saas, POSTGRES_USER: dms_saas, POSTGRES_PASSWORD: dms_saas }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
  api:
    build: { context: ../backend, dockerfile: ../docker/Dockerfile.backend }
    env_file: ../backend/.env
    environment: { DATABASE_URL: postgres://dms_saas:dms_saas@postgres:5432/dms_saas, REDIS_URL: redis://redis:6379/1 }
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 2 config.wsgi:application"
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: { context: ../backend, dockerfile: ../docker/Dockerfile.backend }
    env_file: ../backend/.env
    environment: { DATABASE_URL: postgres://dms_saas:dms_saas@postgres:5432/dms_saas, REDIS_URL: redis://redis:6379/1 }
    command: celery -A config worker -B -l info
    depends_on: [postgres, redis]
volumes:
  pgdata:
